<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<style>
		body { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; font-size: 10px; color: #1f272e; }
		h1 { font-size: 15px; margin: 0 0 4px 0; }
		.meta { color: #6c7680; font-size: 9px; margin-bottom: 10px; }
		table { width: 100%; border-collapse: collapse; }
		th { background: #f8f9fa; text-align: left; font-weight: 600; }
		th, td { border: 1px solid #e2e6e9; padding: 4px 6px; vertical-align: top; }
		tr:nth-child(even) td { background: #fcfcfc; }
	</style>
</head>
<body>
	<h1>{{ title }}</h1>
	<div class="meta">
		{% for line in meta_lines %}<div>{{ line }}</div>{% endfor %}
		<div>{{ _("Generated on") }} {{ generated_on }} &middot; {{ row_count }} {{ _("rows") }}</div>
	</div>
	<table>
		<thead>
			<tr>{% for column in columns %}<th>{{ column }}</th>{% endfor %}</tr>
		</thead>
		<tbody>
			{% for row in rows %}
			<tr>{% for cell in row %}<td>{{ cell }}</td>{% endfor %}</tr>
			{% endfor %}
		</tbody>
	</table>
</body>
</html>
