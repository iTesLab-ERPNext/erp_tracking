[project]
name = "erp_tracking"
authors = [
    { name = "Your Company", email = "support@example.com" }
]
description = "Traccar GPS tracking integration for ERPNext v15"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "requests>=2.31.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "erp_tracking"

[project.urls]
Homepage = "https://example.com"
